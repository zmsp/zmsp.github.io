<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="resolveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Flow Lines -->
  <!-- Line 1: Antigravity -> MCP -->
  <path d="M 270 210 L 370 210" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="370" cy="210" r="5" fill="#38bdf8" filter="url(#glow)" />
  <!-- Line 2: MCP -> DaVinci -->
  <path d="M 590 210 L 690 210" stroke="url(#mcpGrad)" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="690" cy="210" r="5" fill="#a855f7" filter="url(#glow)" />
  
  <!-- Line 3: MCP -> Local Engines -->
  <path d="M 480 290 L 480 340" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Card 1: Antigravity Agent -->
  <g transform="translate(40, 90)">
    <rect width="230" height="200" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#0284c7" fill-opacity="0.2" />
    <path d="M 28 35 L 35 28 L 42 35 L 35 42 Z" fill="#38bdf8" />
    <text x="62" y="40" fill="#f0f6fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16">Antigravity AI</text>
    <text x="24" y="70" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">Autonomous Agent Layer</text>
    <line x1="24" y1="85" x2="206" y2="85" stroke="#30363d" stroke-width="1" />
    <text x="24" y="112" fill="#c9d1d9" font-family="monospace" font-size="12">• Natural Language Plan</text>
    <text x="24" y="136" fill="#c9d1d9" font-family="monospace" font-size="12">• Bin &amp; Track Prompts</text>
    <text x="24" y="160" fill="#c9d1d9" font-family="monospace" font-size="12">• Edit Engine Tasks</text>
    <text x="24" y="184" fill="#c9d1d9" font-family="monospace" font-size="12">• Review Selects UI</text>
  </g>

  <!-- Card 2: MCP Server -->
  <g transform="translate(370, 70)">
    <rect width="220" height="220" rx="12" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#9333ea" fill-opacity="0.2" />
    <circle cx="35" cy="35" r="7" fill="#c084fc" />
    <text x="60" y="36" fill="#f0f6fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="15">davinci-resolve-mcp</text>
    <text x="60" y="52" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="600" font-size="11">JSON-RPC / stdio</text>
    <line x1="20" y1="72" x2="200" y2="72" stroke="#30363d" stroke-width="1" />
    <rect x="20" y="85" width="180" height="26" rx="6" fill="#1c1917" stroke="#44403c" />
    <text x="30" y="102" fill="#38bdf8" font-family="monospace" font-size="11">media_pool</text>
    <rect x="20" y="118" width="180" height="26" rx="6" fill="#1c1917" stroke="#44403c" />
    <text x="30" y="135" fill="#a855f7" font-family="monospace" font-size="11">timeline &amp; edit_engine</text>
    <rect x="20" y="151" width="180" height="26" rx="6" fill="#1c1917" stroke="#44403c" />
    <text x="30" y="168" fill="#34d399" font-family="monospace" font-size="11">resolve_control</text>
    <rect x="20" y="184" width="180" height="26" rx="6" fill="#1c1917" stroke="#44403c" />
    <text x="30" y="201" fill="#fb923c" font-family="monospace" font-size="11">media_analysis</text>
  </g>

  <!-- Card 3: DaVinci Resolve Studio -->
  <g transform="translate(690, 90)">
    <rect width="230" height="200" rx="12" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#e11d48" fill-opacity="0.2" />
    <!-- Mini Color Wheel Icon -->
    <circle cx="35" cy="35" r="8" fill="none" stroke="url(#resolveGrad)" stroke-width="3" />
    <text x="62" y="40" fill="#f0f6fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="15">DaVinci Resolve</text>
    <text x="24" y="70" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">Studio Local Scripting API</text>
    <line x1="24" y1="85" x2="206" y2="85" stroke="#30363d" stroke-width="1" />
    <text x="24" y="112" fill="#c9d1d9" font-family="monospace" font-size="12">• Automated Bins</text>
    <text x="24" y="136" fill="#c9d1d9" font-family="monospace" font-size="12">• Multi-Track Timelines</text>
    <text x="24" y="160" fill="#c9d1d9" font-family="monospace" font-size="12">• Silence Trimming</text>
    <text x="24" y="184" fill="#c9d1d9" font-family="monospace" font-size="12">• Color &amp; Render Queue</text>
  </g>

  <!-- Bottom auxiliary: Local engines -->
  <g transform="translate(330, 340)">
    <rect width="300" height="50" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="150" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Local Engines: Whisper • FFmpeg • Vision Sampler</text>
  </g>

  <!-- Protocol badges -->
  <rect x="280" y="196" width="80" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.75" />
  <text x="320" y="210" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">JSON-RPC</text>

  <rect x="600" y="196" width="80" height="20" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="0.75" />
  <text x="640" y="210" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">Python API</text>
</svg>
